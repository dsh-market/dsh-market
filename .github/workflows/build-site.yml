name: Build site

on:
  # The catalog changes upstream, not here, so the site has to rebuild on a
  # clock as well as on pushes — otherwise a plugin listed today would not get
  # a page until someone happened to touch this repository.
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'data/registry-snapshot.json'
      - '.github/workflows/build-site.yml'

# The build never writes to the repository: snapshots are fetched into the
# ephemeral checkout and docs/ ships as a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# docs/ is a pure function of the catalog and main's tip, so an older run can
# only produce staler output — supersede it rather than queueing it.
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install

      # Both come from awesome-dsh-plugin, which owns the list, and both are
      # build inputs only — fetched into a checkout that is thrown away and
      # never committed. The market itself reads the live catalog; the
      # bundled fallback it used to have was removed on purpose, because for
      # a catalog stale is not a degraded answer but a wrong one.
      - name: Fetch catalog
        run: |
          # data/ is NOT in the repository: the only two files that ever lived
          # there are both gitignored, so git tracks no such directory and a
          # fresh checkout has none. `curl -o data/…` then fails to open its
          # output and exits 23 before fetching anything, which under the
          # runner's `bash -e` aborts the step (the failure read as a catalog
          # problem; it was a missing directory).
          mkdir -p data

          curl -sfL --retry 3 --retry-delay 5 \
            https://awesome-dsh-plugin.com/plugins.json -o data/registry-snapshot.json

          # READMEs are a nice-to-have: without them pages still build, they
          # just carry no body text. A catalog hiccup should degrade the pages,
          # not cancel the deploy that would have refreshed them — and that
          # tolerance has to survive `bash -e`, so it is an explicit `if`
          # rather than a trailing `|| echo` on a continued line, where a later
          # edit that drops the backslash would silently make it fatal again.
          if ! curl -sfL --retry 3 --retry-delay 5 \
            https://awesome-dsh-plugin.com/readmes.json -o data/readmes-snapshot.json; then
            echo "readmes.json unavailable — building without README bodies"
          fi

      # Unset until the AdSense review clears these domains; while unset the
      # build emits no ad markup and no third-party script, so the site is
      # byte-identical to an ad-free one. A variable rather than a secret:
      # the publisher id ships in the HTML either way.
      - run: node scripts/build-site.mjs
        env:
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}

      # Artifacts are keyed by RUN, and a re-run of a failed job keeps the same
      # run id while uploading a SECOND artifact under the same name — which is
      # what makes actions/deploy-pages fail with "Multiple artifacts named
      # github-pages were unexpectedly found for this workflow run. Artifact
      # count is 2." Naming the artifact per ATTEMPT removes the ambiguity:
      # `github.run_id` alone would not, because that is the one identifier the
      # two attempts of a run share. `github.run_attempt` is what differs.
      # (Old attempts' artifacts are not deleted; upload-pages-artifact keeps
      # them for a day, and the deploy now only ever looks at its own.)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
