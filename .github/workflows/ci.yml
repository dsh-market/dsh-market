name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # `data/registry-snapshot.json` is a DOWNLOAD, not the catalog (see the
  # `snapshot` script in package.json). A plugin entry hand-written into it
  # survives exactly until the next refresh, so a contributor who adds one
  # here has built something that cannot work — and it has now happened
  # twice, despite the PR template saying so in words. Say it at the point
  # the mistake is made instead, and say where the entry actually goes.
  #
  # Refreshing the snapshot for real is legitimate: label the PR
  # `snapshot-refresh` and this step stands down.
  wrong-repo-guard:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'snapshot-refresh')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Refuse a hand-edited catalog snapshot
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qx 'data/registry-snapshot.json'; then
            echo "::error file=data/registry-snapshot.json::This file is a snapshot downloaded from awesome-dsh-plugin.com, not the plugin catalog. An entry added here is overwritten by the next refresh (Build site runs daily), so the plugin would never show up in the market. Add it to https://github.com/awesome-dsh-plugin/awesome-dsh-plugin instead — the snapshot then picks it up on its own. Genuinely refreshing the snapshot? Label the PR 'snapshot-refresh'."
            exit 1
          fi
          echo "snapshot untouched"

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm install
      - run: npm run check
      # The committed client bundle must be reproducible from the committed
      # source (#472, and the review-noise half of the same problem: a
      # 320-line artifact diff on every client PR is where a bad change can
      # hide). npm run check just rebuilt it; if the rebuild differs from
      # what is committed, either the source and artifact are out of sync or
      # the build is environment-dependent — both are things to know loudly.
      - run: git diff --exit-code client/
      - run: npm test
      - run: node scripts/preflight.mjs
      - run: node scripts/validate-registry.mjs
      - run: node scripts/smoke-spawn.mjs

  # Real-pnpm matrix (9/10/11 via npx) pinning the failure signatures behind
  # #20/#21/#22 and the recovery paths the market automates. Network-bound and
  # slower, so it runs as its own lane on Linux only.
  pnpm-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run test:compat

  # Layer-3 web e2e: real dsh (pinned rc) + packed market + real Chromium.
  web-e2e:
    # Both platforms: the install chain is where the market meets pnpm, the
    # loader and the filesystem, and every one of those behaves differently
    # on Windows — the shim, the PATH probe, path separators, process
    # teardown. Running it on Linux alone left every fix to that chain
    # unverified there, while a third of the bug reports come from Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The released line is what users run today; the alpha is what they
        # will run next, and it is where the market breaks first. dsh
        # 0.1.2-alpha.1 removed two exports this plugin imported by name, and
        # the result was the HOST FAILING TO BOOT with the market installed —
        # nothing in CI could see it, because CI only ever ran the released
        # line. A plugin that can stop the host from starting has to be
        # caught before the alpha becomes `latest`.
        dsh: ['0.1.0-rc.8', '0.1.2-alpha.2']
        exclude:
          # Host-API breakage is platform-independent, and Windows web-e2e is
          # the slowest job in the matrix (~8 min). Running the alpha on Linux
          # alone catches the class without doubling the critical path.
          - os: windows-latest
            dsh: '0.1.2-alpha.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm install
      # rc.8+: earlier CLIs unconditionally launched a system browser on
      # `dsh web` boot, which on the Windows runner left orphaned msedge
      # processes and the status endpoint never answering — read as a
      # flaky "dsh boot timeout" (and, on longer specs, an hours-long stuck
      # job) with nothing wrong in this repo's own code. rc.8 added
      # `--no-open`, which tests/web/scaffold.ts now passes.
      - run: npm install -g @deepseek-ai/dsh@${{ matrix.dsh }}
      # --with-deps installs system libraries and is Linux-only.
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npm run test:web
        # Fail loudly if the CLI install above ever breaks: without this the
        # specs would skip and the job would pass green having asserted nothing.
        env:
          DSHM_E2E_REQUIRED: '1'
