<!doctype html>
<!-- One stub per plugin URL, replacing the pages this site used to render
     itself. The catalog's pages live at awesome-dsh-plugin.com; hosting a
     second copy here gave Google 2,954 "alternate page with proper canonical"
     URLs and 212 MB of duplicated third-party text, which is the profile of a
     mirror rather than of a market. The stub keeps old links working (people
     and posts point at /p/…), sends both users and crawlers to the real page,
     and takes itself out of the index. -->
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="canonical" href="__TARGET__">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=__TARGET__">
<script>location.replace(__TARGET_JS__)</script>
<style>
body{font-family:-apple-system,"PingFang SC","SF Pro Text","Segoe UI",sans-serif;max-width:40rem;margin:4rem auto;padding:0 1.5rem;color:#101722;line-height:1.65}
a{color:#c0392b;overflow-wrap:anywhere}
</style>
</head>
<body>
<p>__LEAD__</p>
<p><a href="__TARGET__">__TARGET__</a></p>
</body>
</html>
